spring.application.name=amantes-do-futebol

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.packages-to-scan=com.sdui.amantesdofutebol
springdoc.show-actuator=true
springdoc.writer-with-order-by-keys=true
springdoc.info.title=Amantes do Futebol
springdoc.info.description=API SDUI para cadastro e pesquisa sobre fãs de futebol.
springdoc.info.version=1.0.0
springdoc.info.contact.name=Raquel Calazans
springdoc.info.contact.email=raqcalazans@gmail.com

# O banco e as credenciais são compartilhados com a API CDUI.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/amantes_do_futebol}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
server.port=8080
